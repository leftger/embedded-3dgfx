# Score only the core embedded-3dgfx library (src/). Helper crates (asset_cli,
# load_stl, size_harness) and non-library trees are excluded from Codecov.
ignore:
  - "asset_cli/**"
  - "load_stl/**"
  - "size_harness/**"
  - "tools/**"
  - "benches/**"
  - "examples/**"
  - "assets/**"
  - "docs/**"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        paths:
          - src
    patch:
      default:
        target: 60%
        threshold: 1%
        paths:
          - src
